############################################################
#                      APPLICATION                        #
############################################################
spring.application.name=ecommerce-backend

############################################################
#                      SPRING MVC                         #
############################################################
# Use ANT-style path matching for @RequestMapping
spring.mvc.pathmatch.matching-strategy = ANT_PATH_MATCHER

############################################################
#                       DATABASE                          #
############################################################
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_bkd
spring.datasource.username=root
spring.datasource.password=mayank
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

############################################################
#                         LOGGING                         #
############################################################
logging.level.com.ecommerce.bkd=DEBUG

############################################################
#                         SECURITY                        #
############################################################
# JWT configuration
application.security.jwt.secret-key=4bb6d1dfbafb64a681139d1586b6f1160d18159afd57c8c79136d7490630407c
# 1 day in ms
application.security.jwt.access-token-expiration = 86400000
# 7 days in ms
application.security.jwt.refresh-token-expiration=604800000

############################################################
#                        CLOUDINARY                       #
############################################################
# Cloudinary Configuration
cloudinary.cloud_name=CLOUD_NAME
cloudinary.api_key=API_KEY
cloudinary.api_secret=API_SECRET

############################################################
#                        RAZORPAY                         #
############################################################
razorpay.key.id=rzp_test_YOUR_KEY_ID
razorpay.key.secret=YOUR_KEY_SECRET
razorpay.webhook.secret=webhook_secret_key_123456789

razorpay.x.account_number=1234567890
razorpay.x.base_url=https://api.razorpay.com

############################################################
#                         CACHING                         #
############################################################
# Use Caffeine as cache provider
spring.cache.type=caffeine
spring.cache.cache-names=serviceabilityCheck,regionalData,analytics
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=30m,recordStats

# Cache Monitoring / Expose cache metrics
management.endpoints.web.exposure.include=metrics,caches
management.metrics.cache.enabled=true

############################################################
#                    RATE LIMITING                       #
############################################################
rate.limit.enabled=true
rate.limit.requests-per-minute=100

############################################################
#                    PINCODE VALIDATION                   #
############################################################
pincode.validation.pattern=^[1-9][0-9]{5}$
pincode.messages.not-serviceable=We currently don't deliver to your area, but we're coming soon!
pincode.messages.serviceable=Delivery available in your area

############################################################
#                        AUDIT                            #
############################################################
audit.enabled=true
audit.log-retention-days=30

############################################################
#                      SHIPROCKET                         #
############################################################
# Core credentials
shiprocket.api.email=YOUR_API_EMAIL
shiprocket.api.password=YOUR_API_PASSWORD
shiprocket.api.base-url=https://apiv2.shiprocket.in/v1/external

# Webhook
shiprocket.webhook.secret=${SHIPROCKET_WEBHOOK_SECRET:your_default_secret}
shiprocket.webhook.enabled = true
shiprocket.webhook.endpoint= /api/shipping/webhook

# Authentication token caching (10 days in seconds)
shiprocket.auth.tokenExpiry = 864000

# Channels
shiprocket.channel.default-code   = CUSTOM
# 24 hours in ms
shiprocket.channel.cache-duration = 86400000

# IP-whitelist (CIDR or individual addresses)
shiprocket.whitelisted-ips = 13.127.0.0/16,13.127.1.12

# Sync / retry intervals (ms or minutes as noted)
# 1 hour
shiprocket.api.channel-sync-interval = 3600000   
shiprocket.pickup.max-retry-attempts = 3
shiprocket.pickup.retry-delay-minutes = 30
# 1 hour
shiprocket.tracking.update-interval = 3600000   

# Rate limiting for Shiprocket outgoing calls
shiprocket.rate-limit.max-requests=100
# 1 minute
shiprocket.rate-limit.time-window=60000

############################################################
#                    SPRINGDOC / OPENAPI                    #
############################################################
springdoc.api-docs.path = /v3/api-docs
springdoc.swagger-ui.path = /swagger-ui
springdoc.swagger-ui.enabled = true
springdoc.packages-to-scan = com.ecommerce.bkd.controllers